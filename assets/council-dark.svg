<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t">
<title id="t">Council flow: retrieve, independent analysis, cross-review, synthesis</title>
<desc>Council flow for one question. The orchestrator retrieves scoped memory, then Claude and Codex each write an independent analysis in parallel. Each then reviews the other's result. A synthesizer reconciles all four into a final answer and a list of proposed memories, which you confirm. Every phase is stored as a message in SQLite (task_packet, agent_result, peer_review, synthesis), so runs are audited and resumable.</desc>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tx { fill: #ecece8; }
.mu { fill: #9b9a94; }
.clay { fill: #d97757; }
.sage { fill: #9bb07c; }
.eyebrow { font-size: 22px; letter-spacing: 4px; }
.title { font-weight: 700; letter-spacing: -1.5px; }
.tag { font-size: 28px; }
.node { font-size: 24px; font-weight: 600; }
.sub { font-size: 22px; }
.cap { font-size: 22px; }
.small { font-size: 20px; }
.num { font-variant-numeric: tabular-nums; }
.hdr { font-size: 20px; }
.file { font-size: 20px; }
.lane { font-size: 20px; }
.chip { font-size: 22px; }
</style>
