<text class="sans chip tx" x="1138.0" y="240" text-anchor="middle">memory proposals</text>
<text class="mono hdr clay" x="1138.0" y="288.0" text-anchor="middle">you confirm</text>
<text class="sans lane mu" x="32" y="420"><tspan class="mono tx">SQLite</tspan>  every step is recorded for audit; <tspan class="mono">--resume</tspan> reuses completed phases</text>
